name: Muse Link
version: "1.2.0"
slug: muse_link
description: Talk or type to your Muse from a HomeGlow wall display.
url: https://github.com/jasonstantler/homeglow-muse
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Bluetooth sockets only exist in the host's network namespace, and borrowing
# the adapter for pairing needs network-admin. Only Muse Link's pairing helper
# keeps that permission; the rest of the add-on drops it when it starts.
host_network: true
privileged:
  - NET_ADMIN
# Fallback: pair through the host's BlueZ over D-Bus if the adapter can't be borrowed.
host_dbus: true
# Lets the setup page read its ingress address and this machine's address.
hassio_api: true
ingress: true
ingress_port: 0
panel_icon: mdi:creation
panel_title: Muse Link
options:
  sdk_token: ""
  bridge_port: 8791
schema:
  sdk_token: password?
  bridge_port: port
