configuration:
  sdk_token:
    name: Muse SDK token
    description: >-
      From gadgets.muse.ai (Account, then SDK tokens). It starts with mgst_.
      Restart the add-on after changing it.
  bridge_port:
    name: Wall card port
    description: >-
      The port on this Home Assistant machine that the HomeGlow Muse card
      connects to. Change it only if something else already uses 8791.
